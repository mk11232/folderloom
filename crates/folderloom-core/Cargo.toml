[package]
name = "folderloom-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
fs2 = "0.4"
blake3 = "1.8"
libc = "0.2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
