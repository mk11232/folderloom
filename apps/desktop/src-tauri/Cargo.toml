[package]
name = "folderloom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "folderloom_desktop"

[[bin]]
name = "folderloom-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
folderloom-core = { path = "../../../crates/folderloom-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
